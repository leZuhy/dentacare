<mat-card class="product-card" appearance="outlined">
  <div class="product-image">
    @if (product.imageUrl | apiUrl; as src) {
      <img [src]="src" [alt]="product.name" loading="lazy" />
    } @else {
      <!-- placeholder kad proizvod nema sliku -->
      <mat-icon class="placeholder" aria-hidden="true">inventory_2</mat-icon>
    }
  </div>

  <mat-card-content class="product-body">
    <span class="category">{{ product.categoryName }}</span>
    <h3 class="name">{{ product.name }}</h3>
    @if (product.description) {
      <p class="description">{{ product.description }}</p>
    }
    <div class="price">{{ product.price | money }}</div>
  </mat-card-content>

  <mat-card-actions class="product-actions">
    @if (outOfStock) {
      <span class="out-of-stock">{{ 'PRODUCT_CARD.OUT_OF_STOCK' | translate }}</span>
    } @else {
      <button mat-flat-button type="button" (click)="addToCart()">
        <mat-icon>add_shopping_cart</mat-icon>
        {{ 'PRODUCT_CARD.ADD_TO_CART' | translate }}
      </button>
    }
  </mat-card-actions>
</mat-card>
